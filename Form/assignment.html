<body>
     <h1>Student Registration Form</h1>
     <br><br>
     <label for="Name">Name:</label>
     <input type="text" placeholder="Enter your name"
     <label>College:</label>
     <input type="text" placeholder="Nepathya College" disabled selected><br><br>
     <label for="email">Email:</label>
     <input type="email" placeholder="enter emmail">
     <label for="password">Password</label>
     <input type="password" placeholder="Enter your password">
     <br><br>
     <label for="Phone number">Phone Number:</label>
     <input type="tel" placeholder="Enter your phone number">
     <label for="Date">Date:</label>
     <input type="date">

     <h3>Favourite Programming Languages</h3>
     <input type="checkbox"> C
     <input type="checkbox"> C++
     <input type="checkbox"> Javascript
     <br><br>

     <h3>Select your gender</h3>
     <input type="radio" name="gender"> Man
     <input type="radio" name="gender"> Female

     <h3>Select Course</h3>
     <select name="Select course">
     </select>

     <h3>Upload your document<input type="file"></h3>

     <h3>Message/Feedback/Bio/Caption</h3>
     <textarea placeholder ="Message/feedback/Bio/Caption" rows= "5" cols="100"></textarea><br><br>
